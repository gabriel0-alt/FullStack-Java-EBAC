<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMPOS</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bebas+Neue&family=Bungee&family=Momo+Trust+Display&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">


</head>
<body>
    
    <div class="container">
<form id="form">
        <div class="header">
            <h1>
                Comparador de Números
            </h1>
            <p>Verifique se o número A é maior que o número B</p>
        </div>

        <div class="campos">
            <label for="numeroA"> Número A</label>
            <input type="number" id="numeroA" placeholder="Digite o número A" >
        </div>

        <div class="divisor">
        
        </div>
        <div class="campos">
            <label for="numeroB"> Número B </label>   
            <input type="number" id="numeroB" placeholder="Digite o Número B">
        </div>
            <button class="botao-comparar" type="submit"> Comparar</button>
        </form>
        
            <div>
                <p id="resultado" class="resultado"></p>
            </div>
    </div>

    <script src="main.js">
    </script>
</body>
</html>
